<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Quant Desk turns a plain-language question into rules you can read, test on history, and explain." />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Quant" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Quant Desk" />
    <meta property="og:title" content="Quant Desk" />
    <meta property="og:description" content="Ask in plain language; turn the answer into rules you can read, test and explain." />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Runs before the bundle so the first painted frame already has the
      // user's theme, language and direction. Without it a saved light/ar
      // session paints dark-LTR first and flips a frame later.
      (function () {
        try {
          var d = document.documentElement;
          var pref = localStorage.getItem('app.theme');
          if (pref !== 'light' && pref !== 'dark' && pref !== 'system') pref = 'system';
          var theme =
            pref === 'system'
              ? window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
              : pref;
          d.dataset.theme = theme;
          d.dataset.themePref = pref;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#fdfdfe' : '#0a0a0c');
          var l = localStorage.getItem('app.lang');
          if (l !== 'zh' && l !== 'en' && l !== 'ar') {
            var n = (navigator.language || 'en').toLowerCase();
            l = n.indexOf('ar') === 0 ? 'ar' : n.indexOf('zh') === 0 ? 'zh' : 'en';
          }
          d.lang = l;
          d.dir = l === 'ar' ? 'rtl' : 'ltr';
          d.dataset.updown = l === 'zh' ? 'cn' : 'intl';
          if (window.matchMedia('(hover: none)').matches) d.dataset.touch = 'true';
        } catch (e) {}
      })();
    </script>
    <title>Quant Desk</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
