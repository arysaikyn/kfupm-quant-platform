<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Quant Desk turns a plain-language question into rules you can read, test on history, and explain." />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050309" />
    <script>
      // Runs before the bundle so the first painted frame already has the
      // user's theme, language and direction. Without it a saved light/ar
      // session paints dark-LTR first and flips a frame later.
      (function () {
        try {
          var d = document.documentElement;
          var t = localStorage.getItem('app.theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          var l = localStorage.getItem('app.lang');
          if (l !== 'zh' && l !== 'en' && l !== 'ar') {
            var n = (navigator.language || 'en').toLowerCase();
            l = n.indexOf('ar') === 0 ? 'ar' : n.indexOf('zh') === 0 ? 'zh' : 'en';
          }
          d.dataset.theme = t;
          d.lang = l;
          d.dir = l === 'ar' ? 'rtl' : 'ltr';
          d.dataset.updown = l === 'zh' ? 'cn' : 'intl';
        } catch (e) {}
      })();
    </script>
    <title>Quant Desk</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
